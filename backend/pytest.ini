[pytest]
asyncio_mode = auto
testpaths = tests
pythonpath = . tests
addopts = -q --tb=short -m 'not live and not spotify_live'
markers =
    live: hits the real LLM API; needs credentials and network. Run with: pytest -m live
    spotify_live: hits the real Spotify API; needs credentials and network. Run with: pytest -m spotify_live
